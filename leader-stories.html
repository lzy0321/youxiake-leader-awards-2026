<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传领队故事</title><link rel="stylesheet" href="style.css"></head><body><main class="page story-page"><a class="return-link" href="./ranking.html">← 返回完整榜单</a><h1>上传领队故事</h1><div class="story-identity"><img id="storyAvatar" alt="领队头像"><div><b id="storyIdentity"></b><small>审核通过后展示在你的领队海报下方</small></div></div><section class="story-section"><div class="story-section-heading"><h2>遇见</h2><span id="yujianReview" class="story-review"></span></div><p>从你发布过的遇见中，选一篇领队故事。</p><div id="encounterList" class="encounter-list"></div><button type="button" class="story-submit" id="saveEncounter">提交审核</button><p class="story-status" id="encounterStatus" role="status"></p></section><section class="story-section"><div class="story-section-heading"><h2>小红书</h2><span id="xiaohongshuReview" class="story-review"></span></div><label for="rednoteLink">复制笔记链接或分享文案，粘贴到这里</label><textarea id="rednoteLink" rows="3" placeholder="粘贴小红书笔记链接或分享文案"></textarea><div id="rednotePreview" hidden><div class="story-link-preview"><img id="rednoteImage" alt="笔记封面示意"><div><span>小红书笔记</span><small>演示预览 · 尚未读取真实笔记</small></div></div><h3 id="rednoteTitle" class="submitted-note-title"></h3></div><button type="button" class="story-submit" id="saveRednote">提交</button><p class="story-status" id="rednoteStatus" role="status" aria-live="polite"></p></section><details class="review-demo"><summary>审核状态演示</summary><p>仅用于预览页面状态，正式审核由后台完成。</p><label>遇见<select id="demoYujian"><option value="draft">未提交</option><option value="pending">审核中</option><option value="rejected">未通过</option><option value="approved">已通过</option></select></label><label>小红书<select id="demoXiaohongshu"><option value="draft">未提交</option><option value="pending">审核中</option><option value="rejected">未通过</option><option value="approved">已通过</option></select></label></details></main><script src="ranking-data.js"></script><script src="leader-stories.js"></script></body></html>
